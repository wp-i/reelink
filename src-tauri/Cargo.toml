[package]
name = "reelink"
version = "0.1.4"
description = "A local-first Windows utility for QR codes and media filenames"
authors = ["Reelink contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "reelink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rqrr = "0.10"
arboard = "3"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.27"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"
qrcode = "0.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "unwind"
